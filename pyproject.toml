[project]
name = "docflow"
version = "0.1.0"
description = "Small command-line utilities for document workflows"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
batch-ocr = "docflow.legacy.batch_ocr:main"
docflow = "docflow.cli.app:main"
jpg2pdf = "docflow.legacy.jpg2pdf:main"
pdftools = "docflow.legacy.pdftools:main"

[project.optional-dependencies]
pdf = [
    "pypdf>=4.0",
]
image = [
    "Pillow>=10.0",
    "reportlab>=4.0",
]
ocr = [
    "pymupdf>=1.24",
]
all = [
    "Pillow>=10.0",
    "pymupdf>=1.24",
    "pypdf>=4.0",
    "reportlab>=4.0",
]
dev = [
    "pyinstaller>=6.0",
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docflow"]

[tool.ruff]
line-length = 100
