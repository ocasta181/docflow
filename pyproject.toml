[project]
name = "docflow"
version = "0.1.0"
description = "Small command-line utilities for document workflows"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
docflow = "docflow.cli.app:main"

[project.optional-dependencies]
pdf = [
    "pypdf>=4.0",
]
image = [
    "Pillow>=10.0",
    "reportlab>=4.0",
]
ocr = [
    "pymupdf>=1.24",
]
all = [
    "Pillow>=10.0",
    "pymupdf>=1.24",
    "pypdf>=4.0",
    "reportlab>=4.0",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docflow"]
