name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v8

      - name: Check generated docs
        run: |
          uv run --extra dev --extra pdf --extra image --extra ocr python tools/generate_cli_docs.py
          git diff --exit-code docs/cli.md

      - name: Lint
        run: uv run --extra dev ruff check src tests tools

      - name: Check formatting
        run: uv run --extra dev ruff format --check src tests tools

      - name: Type-check
        run: uv run --extra dev --extra pdf --extra image --extra ocr pyright

      - name: Test
        run: uv run --extra dev --extra pdf --extra image --extra ocr pytest tests -q

  package:
    name: Package smoke tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8

      - name: Build package
        run: uv build

      - name: Smoke test no-extra wheel
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          wheel="$(ls dist/docflow_cli-*.whl)"
          uv venv "$tmp/venv"
          uv pip install --python "$tmp/venv/bin/python" "$wheel"
          "$tmp/venv/bin/docflow" --help >/dev/null

          set +e
          output=$("$tmp/venv/bin/docflow" pdf reverse "$tmp/missing.pdf" 2>&1 >/dev/null)
          status=$?
          set -e

          test "$status" -eq 1
          printf '%s\n' "$output" | grep -F 'Missing optional dependency: pypdf' >/dev/null
          printf '%s\n' "$output" | grep -F 'docflow-cli[pdf]' >/dev/null

          set +e
          output=$("$tmp/venv/bin/docflow" image to-pdf "$tmp/scans" 2>&1 >/dev/null)
          status=$?
          set -e

          test "$status" -eq 1
          printf '%s\n' "$output" | grep -F 'Missing optional dependency: Pillow' >/dev/null
          printf '%s\n' "$output" | grep -F 'docflow-cli[image]' >/dev/null

          set +e
          output=$("$tmp/venv/bin/docflow" ocr run "$tmp/missing.pdf" 2>&1 >/dev/null)
          status=$?
          set -e

          test "$status" -eq 1
          printf '%s\n' "$output" | grep -F 'Missing optional dependency: PyMuPDF' >/dev/null
          printf '%s\n' "$output" | grep -F 'docflow-cli[ocr]' >/dev/null

      - name: Smoke test all-extra wheel
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          wheel="$(ls dist/docflow_cli-*.whl)"
          uv venv "$tmp/venv"
          uv pip install --python "$tmp/venv/bin/python" "$wheel[all]"
          "$tmp/venv/bin/python" - "$tmp" <<'PY'
          from pathlib import Path
          import sys

          import fitz
          from PIL import Image
          from pypdf import PdfWriter

          root = Path(sys.argv[1])

          writer = PdfWriter()
          writer.add_blank_page(width=612, height=792)
          writer.add_blank_page(width=612, height=792)
          with (root / "sample.pdf").open("wb") as file:
              writer.write(file)

          text_doc = fitz.open()
          page = text_doc.new_page()
          page.insert_text((50, 50), "This PDF has extractable text content. " * 10, fontsize=12)
          text_doc.save(root / "text.pdf")
          text_doc.close()

          scans = root / "scans"
          scans.mkdir()
          Image.new("RGB", (200, 300), (255, 0, 0)).save(scans / "scan_1.jpg", "JPEG")
          Image.new("RGB", (200, 300), (0, 255, 0)).save(scans / "scan_2.jpg", "JPEG")
          PY

          "$tmp/venv/bin/docflow" pdf reverse "$tmp/sample.pdf" --output "$tmp/reversed.pdf" >/dev/null
          "$tmp/venv/bin/docflow" image to-pdf "$tmp/scans" --output "$tmp/pdfs" >/dev/null
          "$tmp/venv/bin/docflow" ocr run "$tmp/text.pdf" >/dev/null
          "$tmp/venv/bin/pdftools" reverse "$tmp/reversed.pdf" --output "$tmp/reversed-again.pdf" >/dev/null
          "$tmp/venv/bin/jpg2pdf" "$tmp/scans" --output "$tmp/legacy-pdfs" >/dev/null
          "$tmp/venv/bin/batch-ocr" "$tmp/text.pdf" --dry-run >/dev/null

  ocr-integration:
    name: OCR integration
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8

      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
          tesseract --version

      - name: Run OCR integration test
        run: |
          uv run --extra dev --extra ocr --extra image pytest \
            tests/test_ocr_domain.py -q \
            -k test_ocr_pdf_can_write_custom_output_for_scanned_pdf
