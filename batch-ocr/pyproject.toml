[project]
name = "batch-ocr"
version = "0.1.0"
description = "Recursively OCR PDF files in directories"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[project.scripts]
batch-ocr = "batch_ocr:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
