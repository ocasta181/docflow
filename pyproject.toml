[project]
name = "docflow-cli"
version = "0.1.1"
description = "Small command-line utilities for document workflows"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = [
    "documents",
    "jpeg",
    "ocr",
    "pdf",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
batch-ocr = "docflow_cli.legacy.batch_ocr:main"
docflow = "docflow_cli.cli.app:main"
jpg2pdf = "docflow_cli.legacy.jpg2pdf:main"
pdftools = "docflow_cli.legacy.pdftools:main"

[project.optional-dependencies]
pdf = [
    "pypdf>=4.0",
]
image = [
    "Pillow>=10.0",
    "reportlab>=4.0",
]
ocr = [
    "pymupdf>=1.24",
]
all = [
    "Pillow>=10.0",
    "pymupdf>=1.24",
    "pypdf>=4.0",
    "reportlab>=4.0",
]
dev = [
    "pyright>=1.1",
    "pyinstaller>=6.0",
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/ocasta181/docflow"
Issues = "https://github.com/ocasta181/docflow/issues"
Repository = "https://github.com/ocasta181/docflow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docflow_cli"]

[tool.ruff]
line-length = 100

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
